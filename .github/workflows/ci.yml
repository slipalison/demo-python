name: CI

# A esteira inteira num `uses:` so. Lint, testes com piso de cobertura, imagem
# varrida antes de publicar, sete varreduras de seguranca, Sonar, a versao
# semantica decidida pelos commits e o commit no GitOps — a orquestracao mora em
# slipalison/github-workflows.
#
# A VERSAO VEM DOS COMMITS (2026-09-13). Ninguem escreve numero: `feat:` sobe o
# minor, `feat!:` o major, o resto o patch. A esteira cria a tag vX.Y.Z, a
# release, aponta ghcr.io/slipalison/demo-python:<versao> para o mesmo digest
# que sha-<commit> e escreve `versao` no GitOps. Commit fora do Conventional
# Commits REPROVA o run — e o padrao. O hook em github-workflows/hooks recusa a
# mensagem antes de o commit existir.
#
# O QUE MUDOU EM 2026-09-13
# -------------------------
# Antes eram tres jobs em fila: `testes` -> `imagem` -> `publicar`. A imagem
# esperava os testes por um motivo que nao se sustenta: `docker build` nao
# depende de `pytest`. O que nao pode acontecer e imagem de codigo reprovado
# CHEGAR AO CLUSTER, e quem impede isso e o `publicar`. Agora qualidade, imagem,
# Sonar e seguranca correm juntos e so o deploy espera todos.
#
# NUMEROS MEDIDOS, e nao estimados (demo-python, 2026-09-13):
#   esteira antiga, 3 jobs em fila (testes 18s -> imagem 43s -> publicar 9s): 78s
#   esteira nova, 13 jobs:                                                    100s
# A nova e 22s mais LENTA de relogio, e faz sete varreduras de seguranca, Sonar
# e piso de cobertura que a antiga nao fazia. Os mesmos jobs em fila somariam
# ~5min. O paralelismo nao encurtou o que ja existia: absorveu o que faltava.
#
# O job `imagem` sozinho subiu de 43s para 79s de proposito — ele agora constroi,
# varre e SO ENTAO publica.

on:
  push:
    branches: [main]
  pull_request:

# Tres pushes seguidos rodavam tres esteiras completas ao mesmo tempo, e a
# primeira — ja obsoleta — ainda podia escrever a tag dela no GitOps.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esteira:
    # OBRIGATORIO aqui, e nao la dentro. Um workflow reutilizavel nunca recebe
    # mais permissao do que quem o chama concede, e o padrao desta conta e
    # leitura. Sem `packages: write` o run morre em startup_failure com
    # "requesting 'packages: write', but is only allowed 'packages: read'" — que
    # nao aparece no log de passo nenhum, so na tela do run.
    #
    # `contents: write` e para a tag e a release: existe num job so (lancar), o
    # ultimo da esteira, e nunca em pull request.
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: slipalison/github-workflows/.github/workflows/pipeline.yml@main
    with:
      componentes: '[{"nome":"app","linguagem":"python","versao":"3.13","cobertura":80}]'
      imagem: ghcr.io/slipalison/demo-python
      app: demo-python
      # Dockerfile e chart entram na varredura de configuracao.
      caminho_iac: "."
      # CodeQL nao tem muito o que fazer num app de 150 linhas que ja passa pelo
      # Semgrep; ligar custaria vinte minutos por run para repetir o mesmo
      # resultado. Vale a pena em codigo com fluxo de dados de verdade.
      linguagens_codeql: '[]'

      sonar_projeto: slipalison_demo-python
      sonar_organizacao: slipalison
      sonar_linguagem: python
      sonar_comando_testes: >-
        pip install -r requirements.txt -r requirements-dev.txt &&
        pytest --cov --cov-report=xml:coverage.xml
      sonar_parametros: |
        sonar.python.coverage.reportPaths=coverage.xml
        sonar.sources=app
        sonar.tests=tests
      # `sonar_exigir_token` fica no padrao, que e `true`: se o SONAR_TOKEN
      # sumir deste repositorio, o run FALHA dizendo isso, em vez de ficar verde
      # sem ter analisado uma linha. O secret foi criado em 2026-09-13.
      #
      # O token e um Personal Access Token do SonarCloud (My Account > Access
      # Tokens). No plano Free nao ha token com escopo por projeto — isso exige
      # Team — entao ele age com as permissoes da conta inteira. E a razao de o
      # `semear_secret.py` gravar so onde o secret e de fato consumido.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Chave de deploy com escrita, criada NO homelab-gitops. Alcanca aquele
      # repositorio e mais nada — diferente de um token de conta, que alcanca
      # tudo o que a conta alcanca.
      GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}

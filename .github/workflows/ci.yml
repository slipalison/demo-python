name: CI

# Esteira completa: testa, constroi a imagem e escreve a tag nova no
# repositorio de GitOps. O cluster nao e tocado por aqui — quem aplica e o
# ArgoCD, que le o commit que o passo `publicar` deixa.
#
# Pull request para nos testes e na imagem. So a main chega ao cluster.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    uses: slipalison/github-workflows/.github/workflows/python.yml@main
    with:
      python_version: "3.13"
      min_coverage: 80

  imagem:
    needs: testes
    uses: slipalison/github-workflows/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/slipalison/demo-python

  # O job `publicar` vive na main. Aqui ele esta fora de proposito: sem o
  # secret GITOPS_TOKEN o run inteiro morre em startup_failure, antes de
  # qualquer passo — entao nem os testes rodariam.

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>demo-python — {{ versao }}</title>
  <style>
    /* Cores em variaveis, e nao espalhadas pelas regras.
       A versao anterior tinha `.cartao { background: #fff }` DEPOIS do bloco
       @media de tema escuro. Mesma especificidade, e a ultima regra vence:
       no escuro o cartao voltava a branco enquanto o texto ficava claro —
       branco no branco, ilegivel. Com tokens, a ordem das regras deixa de
       importar: o @media troca o valor, nao disputa a declaracao. */
    :root {
      color-scheme: light dark;
      --fundo: #eef2f9;
      --cartao: #ffffff;
      --borda: #dfe4ec;
      --texto: #14161a;
      --texto-suave: #59616f;
      --destaque: {{ cor }};
      --destaque-texto: #ffffff;
      --sombra: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px rgba(16, 24, 40, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0d1014;
        --cartao: #171b22;
        --borda: #2a313d;
        --texto: #eef1f6;
        --texto-suave: #a6b0be;
        --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    .cartao {
      width: 100%;
      max-width: 34rem;
      background: var(--cartao);
      color: var(--texto);
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 28px 32px;
      box-shadow: var(--sombra);
    }

    .selo {
      display: inline-block;
      background: var(--destaque);
      color: var(--destaque-texto);
      border-radius: 999px;
      padding: 5px 15px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    h1 { font-size: 1.4rem; margin: 18px 0 6px; color: var(--texto); }

    /* Texto secundario com COR propria, nao com opacity: opacity sobre um
       fundo escuro come contraste de um jeito que nao se controla. */
    p.sub { margin: 0 0 24px; color: var(--texto-suave); }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 20px;
      margin: 0;
      align-items: baseline;
    }
    dt { font-size: 14px; color: var(--texto-suave); }
    dd {
      margin: 0;
      color: var(--texto);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 14px;
      word-break: break-all;
    }

    footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--borda);
      font-size: 13px;
      color: var(--texto-suave);
    }
    footer a { color: var(--destaque); font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 420px) {
      .cartao { padding: 22px 20px; }
      dl { grid-template-columns: 1fr; gap: 4px; }
      dt { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main class="cartao">
    <span class="selo">{{ versao }}</span>
    <h1>demo-python</h1>
    <p class="sub">Front-end renderizado no servidor, em Python. Existe para provar
       o caminho do commit até o cluster.</p>

    <dl>
      <dt>Pod</dt>
      <dd>{{ pod }}</dd>
      <dt>No ar há</dt>
      <dd>{{ uptime }} s</dd>
    </dl>

    <footer>
      Durante um canary, recarregar troca o pod que responde — e o selo acima
      muda de versão conforme o peso. <a href="/api/info">/api/info</a>
    </footer>
  </main>
</body>
</html>

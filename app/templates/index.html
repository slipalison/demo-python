<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>demo-python — {{ versao }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: {{ cor }}12;
      color: #14161a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1115; color: #e7e9ee; }
      .cartao { background: #171a21; border-color: #262b36; }
      dt { color: #9aa3b2; }
    }
    .cartao {
      background: #fff;
      border: 1px solid #e3e6ec;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 34rem;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }
    .selo {
      display: inline-block;
      background: {{ cor }};
      color: #fff;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    h1 { font-size: 1.35rem; margin: 16px 0 6px; }
    p.sub { margin: 0 0 22px; opacity: .75; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0; }
    dt { font-size: 14px; opacity: .7; }
    dd { margin: 0; font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 14px; }
    footer { margin-top: 22px; font-size: 13px; opacity: .6; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main class="cartao">
    <span class="selo">{{ versao }}</span>
    <h1>demo-python</h1>
    <p class="sub">Front-end renderizado no servidor, em Python. Existe para provar
       o caminho do commit até o cluster.</p>

    <dl>
      <dt>Pod</dt>
      <dd>{{ pod }}</dd>
      <dt>No ar há</dt>
      <dd>{{ uptime }} s</dd>
    </dl>

    <footer>
      Durante um canary, recarregar troca o pod que responde — e o selo acima
      muda de versão conforme o peso. <a href="/api/info">/api/info</a>
    </footer>
  </main>
</body>
</html>
